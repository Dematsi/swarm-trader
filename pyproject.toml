[project]
name = "swarm-trader"
version = "1.0.0"
description = "An AI-powered hedge fund that uses multiple agents to make trading decisions"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "langchain>=1.3.9,<2",
    "langchain-anthropic>=1.4.6,<2",
    "langchain-groq>=1.0,<2",
    "langchain-openai>=1.1.14,<2",
    "langchain-deepseek>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "langgraph>=1.0.10,<2",
    "pandas>=2.1.0,<3",
    "numpy>=1.24.0,<2",
    "python-dotenv>=1.2.2,<2",
    "matplotlib>=3.9.2,<4",
    "tabulate>=0.9.0,<0.10",
    "colorama>=0.4.6,<0.5",
    "questionary>=2.1.0,<3",
    "rich>=13.9.4,<14",
    "langchain-google-genai>=2.0.11",
    "fastapi[standard]>=0.109.1",
    "fastapi-cli>=0.0.7",
    "pydantic>=2.4.2,<3",
    "httpx>=0.27.0,<0.28",
    "sqlalchemy>=2.0.22,<3",
    "alembic>=1.12.0,<2",
    "langchain-gigachat>=0.3.12",
    "langchain-xai>=0.2.5",
    "yfinance>=1.2.0,<2",
    "psycopg[binary]>=3.2",
    "duckdb>=1.5.5",
    "pyarrow>=25.0.1",
    "exchange-calendars>=4.13,<5",
]

[project.scripts]
backtester = "src.backtesting.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "black>=26.3.1,<27",
    "isort>=5.12.0,<6",
    "flake8>=6.1.0,<7",
]

[tool.uv]
default-groups = "all"

[tool.hatch.build.targets.sdist]
include = [
    "./src",
    "./app",
]

[tool.hatch.build.targets.wheel]
include = [
    "./src",
    "./app",
]

[tool.hatch.build.targets.wheel.sources]
"./src" = "src"
"./app" = "app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 420
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true

[tool.pytest.ini_options]
# Scripts import `src.*` relative to the repo root; mirror that for tests.
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs the equity zip, the sibling Postgres, Alpaca or the network"]
addopts = "-m \"not integration\""
